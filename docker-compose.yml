services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-healthcare_factory}
      POSTGRES_USER: ${POSTGRES_USER:-healthcare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-healthcare}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-healthcare_factory}
    depends_on:
      db:
        condition: service_healthy
    command: alembic upgrade head

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-healthcare}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-healthcare_factory}
      SYNTHETIC_SEED: ${SYNTHETIC_SEED:-20260810}
      SYNTHETIC_PATIENTS: ${SYNTHETIC_PATIENTS:-2000}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"

volumes:
  postgres_data:
